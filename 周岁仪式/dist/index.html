:root{color-scheme:dark;--gold:#f5d596;--cream:#fff3d9}*{box-sizing:border-box}body{margin:0;background:#991e28;color:var(--cream);font-family:"Songti SC","STSong","SimSun",serif;overflow:hidden}body:before{content:"";position:fixed;inset:20px;border:1px solid #e5b76e66;pointer-events:none}body:after{content:"";position:fixed;inset:28px;border:1px solid #e5b76e33;pointer-events:none}main{height:100dvh;position:relative;background:radial-gradient(ellipse at 50% 35%,#ba343c80,transparent 70%);padding:6vh 6vw 12vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.eyebrow{font:500 clamp(14px,1.3vw,22px)/1.5 sans-serif;letter-spacing:.55em;color:var(--gold);margin:0 0 2.3vh}.title{font-size:clamp(42px,6vw,100px);font-weight:600;letter-spacing:.15em;margin:0 0 3vh;text-shadow:0 3px 15px #64121b44}.hero .title{font-size:clamp(48px,7.5vw,126px)}.hero-number{font-family:Georgia,serif;font-size:clamp(105px,19vh,210px);line-height:.9;color:var(--gold);margin-bottom:2vh}.hero-sub{font-size:clamp(22px,2.3vw,38px);letter-spacing:.35em}.verse{font-size:clamp(22px,3.1vw,52px);line-height:1.85;margin:0;white-space:pre-line}.long .verse{font-size:clamp(19px,2.45vw,42px);line-height:1.65}.long .title{margin-bottom:2vh;font-size:clamp(38px,5vw,80px)}.ornament{color:var(--gold);font-size:clamp(18px,2vw,30px);letter-spacing:1em;margin-top:3vh}.corner{position:absolute;top:7vh;writing-mode:vertical-rl;letter-spacing:.45em;color:#f5d596a6;font-size:clamp(16px,1.5vw,24px)}.left{left:5vw}.right{right:5vw}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:2vh 2vw;width:min(86vw,1480px)}.item{border-top:1px solid #f5d59677;padding:1.5vh .6vw;display:flex;flex-direction:column;gap:.5vh}.object{font-size:clamp(18px,2vw,33px)}.job{font-family:system-ui,sans-serif;font-size:clamp(16px,1.55vw,25px);color:var(--gold)}.note{font:clamp(13px,1.1vw,18px)/1.4 system-ui,sans-serif;color:#f5d596bd;margin:2vh 0 0}.objects .title{font-size:clamp(38px,5vw,76px);margin-bottom:1vh}.objects .verse{font-size:clamp(20px,2vw,32px);margin-bottom:2vh}footer{position:fixed;bottom:4vh;left:6vw;right:6vw;display:flex;align-items:center;justify-content:space-between;gap:15px;font-family:system-ui,sans-serif}button{font:inherit;color:var(--cream);background:transparent;border:1px solid #f5d59666;border-radius:99px;padding:10px 20px;cursor:pointer}button:hover,button:focus-visible{background:#f5d59622;outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.3;cursor:default}.nav{display:flex;gap:8px}.nav button{padding:9px 13px;font-size:14px;border-color:transparent}.nav button[aria-current=true]{background:var(--gold);color:#861923}.controls{display:flex;gap:10px}.hint{font-size:13px;color:#f5d596b3}.page{animation:enter .4s ease both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:850px){footer{flex-wrap:wrap;justify-content:center;bottom:3vh}.nav{justify-content:center;flex-wrap:wrap}.nav button{font-size:12px;padding:7px 9px}.hint{display:none}.items{grid-template-columns:repeat(3,1fr);gap:1vh 2vw}main{padding-bottom:20vh}.corner{display:none}.verse{font-size:clamp(18px,3.6vw,30px)}.long .verse{font-size:clamp(16px,3vw,26px)}}@media(prefers-reduced-motion:reduce){.page{animation:none}}body.clean footer{opacity:0;pointer-events:none}body.clean{cursor:none}

/* Large television typography, with embedded Google Fonts. */
body{font-family:"ZCOOL KuaiLe","Songti SC",serif}
main{padding:4vh 5vw 11vh}
.title,.hero .title,.long .title,.objects .title{font-family:"Ma Shan Zheng",cursive;font-weight:400;letter-spacing:.08em;font-size:clamp(54px,min(8.5vw,14vh),164px);line-height:1.08;margin-bottom:3vh}
.hero .title{font-size:clamp(64px,min(12vw,20vh),230px)}
.hero-number{font-size:clamp(90px,16vh,180px)}
.hero-sub{font-size:clamp(26px,3.2vw,62px);letter-spacing:.15em}
.verse{font-size:clamp(24px,min(4.25vw,7.2vh),82px);font-weight:600;line-height:1.6}
.long .verse{font-size:clamp(20px,min(3.5vw,6.2vh),68px);line-height:1.48}
.long .title{font-size:clamp(48px,11vh,118px);margin-bottom:1.5vh}
.long .eyebrow{margin-bottom:1.2vh}
.long .ornament{display:none}
.ornament{margin-top:2vh}
.corner{left:3.2vw;font-size:clamp(15px,1.4vw,24px)}.corner.right{left:auto;right:3.2vw}
.objects .title{font-size:clamp(48px,11vh,118px);margin-bottom:1vh}
.objects .verse{font-size:clamp(23px,3vw,56px);margin-bottom:2vh}
.items{width:84vw;gap:1.4vh 2vw}
.object{font-size:clamp(22px,2.7vw,52px)}
.job{font-family:"ZCOOL KuaiLe",serif;font-size:clamp(19px,2.15vw,42px)}
.item{padding:1.2vh .4vw;gap:.7vh}
.objects .eyebrow{margin-bottom:1vh}
footer{left:5vw;right:5vw;bottom:3.5vh}.hint{display:none}
@media(max-width:850px){main{padding-bottom:21vh}.verse{font-size:clamp(18px,4vw,34px)}.long .verse{font-size:clamp(16px,3.5vw,30px)}.hero .title{font-size:clamp(50px,10.5vw,90px)}.items{width:88vw}.object{font-size:clamp(17px,3.4vw,26px)}.job{font-size:clamp(15px,2.8vw,22px)}}

/* Friendly handwritten body and legible surrounding ceremony text. */
body,.verse,.long .verse,.job{font-family:"ZCOOL KuaiLe","Kaiti SC",cursive;font-weight:400}
.hero-sub{font-size:clamp(28px,3.7vw,70px)}
.corner{font-family:"Ma Shan Zheng",cursive;font-size:clamp(23px,2.25vw,42px);letter-spacing:.28em;top:6vh;color:var(--gold);left:3vw}.corner.right{right:3vw;left:auto}
.eyebrow{font-family:"ZCOOL KuaiLe",cursive;font-size:clamp(20px,2vw,36px);letter-spacing:.3em}
footer{gap:10px;left:5vw;right:5vw;font-family:"ZCOOL KuaiLe",cursive}
.nav{gap:4px}.nav button{font-size:clamp(16px,1.65vw,28px);padding:9px 11px}
.controls{gap:8px}.controls button{font-size:clamp(16px,1.65vw,28px);padding:10px 17px}

@media(max-width:850px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5vh 4vw}.photo-frame{height:21vh}.photo-caption{font-size:20px;padding-top:.6vh}.album .title{font-size:40px}.album .eyebrow{font-size:16px}.photo-view{grid-template-columns:1fr;gap:1vh;text-align:center}#large-photo{height:49vh}#photo-title{font-size:32px;margin:0}#photo-description{font-size:20px;margin:1vh 0}#photo-count{margin:1vh 0}.photo-controls{justify-content:center}#photo-dialog{padding-top:7vh}}

/* Soft, rounded photo edges follow each original image ratio. */
.photo-card{border-radius:24px}
.photo-frame{border:0;border-radius:24px;background:transparent;box-shadow:none;overflow:visible}

/* Seven moments: four above, three centered below. */
.album .title{font-size:clamp(38px,8vh,90px);margin-bottom:1.5vh}
.album .eyebrow{font-size:clamp(17px,2.5vh,28px);margin-bottom:1vh}
.photo-grid{width:80vw;grid-template-columns:repeat(8,minmax(0,1fr));gap:1.6vh 1.6vw}

.photo-frame{height:23vh}
.photo-caption{font-size:clamp(18px,2.8vh,32px);padding-top:.7vh}

@media(max-width:850px){.photo-grid{width:88vw;gap:1.4vh 2vw}.photo-frame{height:19vh}.photo-caption{font-size:clamp(12px,2.4vw,20px)}.album .title{font-size:clamp(32px,6vw,48px)}.photo-frame img{border-width:2px;border-radius:14px}.album .note{font-size:16px}}

.album-feature{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:center;gap:3vw;width:84vw;height:64vh}
.album-large{padding:0;border:0;border-radius:26px;height:64vh;display:flex;justify-content:center;align-items:center;background:none}
.album-large:hover{background:none}
.album-large img{display:block;width:auto;height:auto;max-width:100%;max-height:64vh;border:2px solid #f5d596aa;border-radius:26px;box-shadow:0 10px 30px #470b2338}
.album-copy{text-align:left}.album-copy .title{font-size:clamp(38px,5.5vw,96px);line-height:1.2;margin:2vh 0 3vh}.album-copy .eyebrow{font-size:clamp(18px,1.8vw,32px)}
.album-desc{font-size:clamp(23px,2.7vw,46px);line-height:1.6;margin:0}.album-switch{display:flex;gap:1vw;margin-top:2vh;font-size:clamp(19px,2vw,32px)}

.album-thumbs button[aria-pressed=true]{border-color:var(--gold);opacity:1;background:#f5d59622}

@media(max-width:850px){.album-feature{width:88vw;height:54vh;grid-template-columns:1.4fr 1fr;gap:3vw}.album-large{height:54vh}.album-large img{max-height:54vh;border-radius:18px}.album-copy .title{font-size:clamp(26px,5vw,42px)}.album-copy .eyebrow{font-size:14px}.album-desc{font-size:clamp(16px,2.8vw,24px)}.album-switch{font-size:16px;flex-wrap:wrap}.album-switch button{padding:8px 12px}.album-thumbs{height:8vh}.album-thumbs button{width:10vw;height:8vh}}

.slide-progress{width:100%;height:9px;border-radius:99px;background:#f5d59633;overflow:hidden;margin:2vh 0 1vh}
#slide-progress-fill{display:block;width:100%;height:100%;background:var(--gold);border-radius:99px;transform:scaleX(0);transform-origin:left}
.album-switch{flex-wrap:wrap}.album-switch button{padding:9px 15px}
</style></head><body><main id="stage" aria-live="polite"></main><footer><div class="nav" id="nav" aria-label="仪式流程"></div><div class="controls"><button id="prev" aria-label="上一步">上一步</button><button id="next">开始仪式</button><button id="full">全屏</button></div><span class="hint">左右键翻页 · F 全屏 · H 隐藏操作栏</span></footer><dialog id="photo-dialog" aria-label="成长照片"><button id="close-photo" autofocus>关闭照片</button><div class="photo-view"><img id="large-photo" alt=""><div><h2 id="photo-title"></h2><p id="photo-description"></p><p id="photo-count"></p><div class="photo-controls"><button id="previous-photo">上一张</button><button id="next-photo">下一张</button></div></div></div></dialog><script>
const steps=[
{title:'宝宝一岁啦',hero:true},
{title:'成长相册',album:true},
{title:'滚灾',verse:'滚灾滚灾，灾难滚开\n宝宝聪明，健康常在'},
{title:'净手',verse:'一洗手，聪明伶俐，应有尽有\n二洗手，平平安安，腰缠万贯\n三洗手，生活富裕，顺顺利利'},
{title:'梳头',long:true,verse:'一梳智慧开，宝宝聪明又可爱。\n二梳财运来，宝宝财运滚滚来。\n三梳手儿巧，宝宝抓啥都是宝。\n四梳人缘好，朋友多的不得了。\n五梳身体好，无病无灾立业早。\n妈妈梳梳头，长命百岁好宝宝。'},
{title:'过聪明门',verse:'青葱门下过，才华横溢智慧高。\n青葱头上顶，聪明绝顶赛群英。\n青葱手中握，出类拔萃智谋多。'},
{title:'敲启智锣',verse:'一敲智慧打开\n二敲及第登科\n三敲财运兴旺'},
{title:'抓周',objects:true,verse:'小手抓住喜欢，未来皆是精彩。'}];
const photos=[['first-meeting.webp','初次见面','刚出生的你，小小的，软软的。'],['sleeping.webp','香甜的梦','月子中心里，睡得香香的小宝贝。'],['little-stretch.webp','伸个小懒腰','小手伸一伸，和世界打个招呼。'],['dad-hug.webp','爸爸的怀抱','在爸爸怀里，安心睡个好觉。'],['grandma-hug.webp','奶奶的怀抱','靠在奶奶怀里，做一个香甜的梦。'],['tummy-time.webp','抬头看世界','回到家，已经会趴着看世界啦。'],['warm-hug.webp','暖暖的抱抱','贴一贴小脸，把欢喜抱个满怀。'],['happy-meal-v2.webp','吃饭也快乐','小脸沾满饭，笑容装满甜。']];
const items=[['计算器','金融行业'],['鼠标','IT行业'],['泳镜','运动员'],['马克笔','科学家'],['书','作家'],['画笔','画家'],['软卷尺','设计师'],['饭勺','美食行业'],['耳机','音乐家'],['红包（现金）','商人'],['槌子','法官'],['耳温枪','医生']];
const slideDuration=6000;let albumElapsed=0,albumPaused=false,albumLastFrame=0;let albumIndex=0;let current=0;const stage=document.getElementById('stage'),nav=document.getElementById('nav'),prev=document.getElementById('prev'),next=document.getElementById('next');
function albumMarkup(){const [file,title,desc]=photos[albumIndex];return '<div class="album-feature"><button class="album-large" data-photo="'+albumIndex+'" aria-label="放大照片：'+title+'"><img src="photos/'+file+'" alt="'+desc+'"></button><div class="album-copy"><p class="eyebrow">慢慢长大的你</p><h1 class="title">'+title+'</h1><p class="album-desc">'+desc+'</p><p class="note">'+(albumIndex+1)+' / '+photos.length+'</p><div class="slide-progress" role="progressbar" aria-label="当前照片播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="slide-progress-fill"></span></div><div class="album-switch"><button data-album-toggle>'+(albumPaused?'继续':'暂停')+'</button><button data-album-step="-1">上一张</button><button data-album-step="1">下一张</button></div></div></div><div class="album-thumbs" aria-label="选择照片">'+photos.map(([f,t],i)=>'<button data-album-photo="'+i+'" aria-label="'+t+'" aria-pressed="'+(i===albumIndex)+'"><img src="photos/'+f+'" alt="'+t+'"></button>').join('')+'</div>'}
function render(){albumElapsed=0;let s=steps[current];stage.className=s.hero?'hero':s.album?'album':s.long?'long':s.objects?'objects':'';stage.innerHTML='<span class="corner left">一岁一礼 · 一寸欢喜</span><span class="corner right">平安喜乐 · 自在长大</span><section class="page">'+(s.album?albumMarkup():s.hero?'<p class="eyebrow">周 岁 喜 乐</p><div class="hero-number">1</div><h1 class="title">宝宝一岁啦</h1><p class="hero-sub">愿你岁岁欢喜，日日可爱</p><div class="ornament">✦ ✦ ✦</div>':'<p class="eyebrow">周岁礼 · '+(current-1)+' / 6</p><h1 class="title">'+s.title+'</h1><p class="verse">'+s.verse+'</p>'+(s.objects?'<div class="items">'+items.map(([o,j])=>'<div class="item"><span class="object">'+o+'</span><span class="job">'+j+'</span></div>').join('')+'</div><p class="note">每一次选择，都是美好的祝福</p>':'<div class="ornament">✦</div>'))+'</section>';nav.innerHTML=steps.map((s,i)=>'<button data-index="'+i+'" aria-current="'+(i===current)+'">'+(i?s.title:'开场')+'</button>').join('');prev.disabled=current===0;next.textContent=current===0?'看看成长':current===1?'开始仪式':current===steps.length-1?'回到开场':'下一步';}
function go(n){current=Math.max(0,Math.min(steps.length-1,n));render()}prev.onclick=()=>go(current-1);next.onclick=()=>go(current===steps.length-1?0:current+1);nav.onclick=e=>{const b=e.target.closest('button');if(b)go(Number(b.dataset.index))};
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('full').textContent='请用浏览器全屏'}}document.getElementById('full').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>document.getElementById('full').textContent=document.fullscreenElement?'退出全屏':'全屏');document.addEventListener('keydown',e=>{if(document.getElementById('photo-dialog').open){if(e.key==='ArrowRight'){e.preventDefault();showPhoto((photoIndex+1)%photos.length)}else if(e.key==='ArrowLeft'){e.preventDefault();showPhoto((photoIndex+photos.length-1)%photos.length)}return;}if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home')go(0);else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key.toLowerCase()==='h')document.body.classList.toggle('clean')});document.addEventListener('pointermove',()=>document.body.classList.remove('clean'));render();
let photoIndex=0;const photoDialog=document.getElementById('photo-dialog');
function showPhoto(i){photoIndex=i;const [file,title,desc]=photos[i];document.getElementById('large-photo').src='photos/'+file;document.getElementById('large-photo').alt=desc;document.getElementById('photo-title').textContent=title;document.getElementById('photo-description').textContent=desc;document.getElementById('photo-count').textContent=(i+1)+' / '+photos.length}
stage.addEventListener('click',e=>{const toggle=e.target.closest('[data-album-toggle]');if(toggle){albumPaused=!albumPaused;toggle.textContent=albumPaused?'继续':'暂停';return;}const thumb=e.target.closest('[data-album-photo]');if(thumb){albumIndex=Number(thumb.dataset.albumPhoto);render();return}const step=e.target.closest('[data-album-step]');if(step){albumIndex=(albumIndex+Number(step.dataset.albumStep)+photos.length)%photos.length;render();return}const b=e.target.closest('[data-photo]');if(b){showPhoto(Number(b.dataset.photo));photoDialog.showModal()}});
document.getElementById('close-photo').onclick=()=>photoDialog.close();document.getElementById('previous-photo').onclick=()=>showPhoto((photoIndex+photos.length-1)%photos.length);document.getElementById('next-photo').onclick=()=>showPhoto((photoIndex+1)%photos.length);

function carouselFrame(now){const delta=albumLastFrame?Math.min(now-albumLastFrame,250):0;albumLastFrame=now;
 if(current===1&&!albumPaused&&!document.hidden&&!photoDialog.open){const photo=stage.querySelector('.album-large img');if(photo&&photo.complete&&photo.naturalWidth>0){albumElapsed+=delta;if(albumElapsed>=slideDuration){albumIndex=(albumIndex+1)%photos.length;render();}const progress=Math.min(albumElapsed/slideDuration,1);const fill=document.getElementById('slide-progress-fill');if(fill){fill.style.transform='scaleX('+progress+')';fill.parentElement.setAttribute('aria-valuenow',String(Math.round(progress*100)));}}}
 requestAnimationFrame(carouselFrame);
}
requestAnimationFrame(carouselFrame);
</script></body></html>
